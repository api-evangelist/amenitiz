aid: amenitiz
name: Amenitiz
description: >-
  Amenitiz is an all-in-one hotel management platform built exclusively for
  independent hotels and B&Bs in Europe. Founded in 2017 and headquartered in
  Barcelona, Spain, it is trusted by 15,000+ properties across Spain, France,
  Italy, and Portugal. The platform combines a property management system (PMS),
  a commission-free direct booking engine, a channel manager connecting to 150+
  OTAs (Booking.com Premier Plus Connectivity Partner), a hotel website builder,
  dynamic pricing (PriceAdvisor), and native payment processing (AmenitizPay) in
  a single per-room monthly subscription. Amenitiz exposes a REST API for
  Enterprise-tier customers, documented on a Stoplight developer portal at
  developers.amenitiz.com; access is requested through the in-product dashboard.
  Amenitiz is a Point Nine portfolio company.
